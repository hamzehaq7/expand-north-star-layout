:root{--ink:#d6334a;--ink2:#a8192f;--blue:#2200FF;--paper:#fbf9f3;--desk:#6b4a2e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Hand","Segoe Print","Comic Sans MS",cursive;color:var(--ink);
  background:radial-gradient(circle at 30% 20%,#7a5434,#5a3a20 60%,#3f2814);padding:28px 16px;display:flex;justify-content:center}
.wrap{display:flex;gap:26px;align-items:flex-start;max-width:1260px;width:100%;justify-content:center;flex-wrap:wrap}
.sheet{position:relative;flex:1 1 640px;max-width:860px;background:var(--paper);border-radius:3px;transform:rotate(-.6deg);
  box-shadow:0 1px 0 #fff inset,0 18px 40px rgba(0,0,0,.45),0 3px 8px rgba(0,0,0,.3)}
.sheet:before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:3px;
  background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:22px 22px}
svg{display:block;width:100%;height:auto;position:relative}
svg text{fill:var(--ink);font-family:"Hand",cursive}
.ink{stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1.5}
.hot{cursor:pointer;transition:filter .2s}
.hot:hover,.hot.lit{filter:url(#wobble) drop-shadow(0 0 6px rgba(34,0,255,.45))}
.hot:hover .ink,.hot.lit .ink{stroke:var(--blue)}
.hot:hover text,.hot.lit text{fill:var(--blue)}
.num{cursor:pointer}
.num .ring{fill:none;stroke:var(--ink);stroke-width:2;opacity:.6;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
.num .dot{fill:var(--paper);stroke:var(--ink);stroke-width:2.6;transition:all .2s}
.num text{font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:central;transition:fill .2s}
.num:hover .dot,.num.lit .dot{fill:var(--ink);stroke:var(--ink)}
.num:hover text,.num.lit text{fill:#fff}
@keyframes pulse{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(1.9);opacity:0}}
.beam{animation:beam 3.5s ease-in-out infinite}
.beam.b2{animation-delay:1.75s}
@keyframes beam{0%,100%{opacity:.25}50%{opacity:.7}}
.logo{animation:logo 3.5s ease-in-out infinite}
@keyframes logo{0%,100%{opacity:.35}50%{opacity:1}}
.flow{stroke-dasharray:8 9;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-34}}
.note{animation:note 3s ease-in-out infinite;opacity:0}
.note.n2{animation-delay:1s}.note.n3{animation-delay:2s}
@keyframes note{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(14px,-40px)}}
.tape{position:absolute;width:120px;height:30px;background:rgba(255,240,170,.75);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.legend{flex:0 1 330px;background:var(--paper);padding:20px 22px 16px;border-radius:3px;transform:rotate(1deg);position:relative;
  box-shadow:0 18px 40px rgba(0,0,0,.45);margin-top:30px;
  background-image:repeating-linear-gradient(var(--paper) 0 33px,#c9dcf0 33px 34px);background-position:0 54px}
.legend:before{content:"";position:absolute;left:40px;top:0;bottom:0;width:1.5px;background:rgba(214,51,74,.45)}
.legend h3{margin:0 0 6px 30px;font-size:30px;line-height:1.1}
.legend ol{list-style:none;margin:0;padding:0 0 0 30px}
.legend li{font-size:22px;line-height:34px;cursor:pointer;display:flex;gap:10px;align-items:center;white-space:nowrap}
.legend li b{display:inline-grid;place-items:center;width:25px;height:25px;border:2px solid var(--ink);border-radius:50%;font-size:16px;flex:none;line-height:1}
.legend li:hover,.legend li.lit{color:var(--blue)}
.legend li:hover b,.legend li.lit b{background:var(--ink);color:#fff;border-color:var(--ink)}
.legend .luma{display:inline-block;margin:0 0 6px 30px;font-size:22px;line-height:34px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.legend .luma:hover{color:var(--blue)}
.legend .hint{font-size:18px;color:#8a7a70;margin:8px 0 0 30px}
#modal{position:fixed;inset:0;background:rgba(30,15,5,.45);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#modal.open{opacity:1;pointer-events:auto}
#card{position:relative;background:#fffdf5;width:min(440px,90vw);padding:30px 28px 22px;transform:rotate(-1.5deg) scale(.9);transition:transform .25s cubic-bezier(.2,1.4,.4,1);
  box-shadow:0 20px 50px rgba(0,0,0,.4);background-image:repeating-linear-gradient(#fffdf5 0 31px,#d8e6f3 31px 32px);background-position:0 72px}
#modal.open #card{transform:rotate(-1.5deg) scale(1)}
#card .tape{top:-14px;left:50%;margin-left:-60px;transform:rotate(-3deg)}
#card .badge{position:absolute;top:-18px;left:-18px;width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:700;box-shadow:0 3px 8px rgba(0,0,0,.3);transform:rotate(-8deg)}
#card h2{margin:0 0 8px;font-size:34px;line-height:1.05}
#card p{margin:0;font-size:23px;line-height:32px;color:#3a2a2a}
#card .tag{display:inline-block;margin-top:10px;font-size:18px;border:1.5px dashed var(--ink);padding:0 10px;border-radius:12px}
#card .ph{margin-top:14px;border:2px dashed var(--ink);padding:22px;text-align:center;font-size:21px;background:rgba(214,51,74,.05)}
#card .pics{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#card .pics .pic+.pic{transform:rotate(-2deg)}
#card .pic{margin:14px auto 0;width:fit-content;background:#fff;padding:8px 8px 22px;box-shadow:0 4px 12px rgba(0,0,0,.25);transform:rotate(2deg)}
#card .pic img{display:block;max-height:min(300px,40vh);max-width:100%}
#card .pics:has(.pic+.pic) img{max-height:min(200px,30vh)}
#card .nav{display:flex;justify-content:space-between;margin-top:16px}
#card button{font-family:inherit;font-size:20px;color:var(--ink);background:none;border:1.5px solid var(--ink);border-radius:16px;padding:2px 14px;cursor:pointer}
#card button:hover{background:var(--ink);color:#fff}
#close{position:absolute;top:6px;right:8px;border:none!important;font-size:30px!important;line-height:1;padding:0 6px!important}
@media(max-width:1000px){.legend{transform:none;margin-top:0}.sheet{transform:none}}

const ns="http://www.w3.org/2000/svg",G=document.getElementById("nums");
pos.forEach(([n,x,y])=>{const g=document.createElementNS(ns,"g");g.setAttribute("class","num");g.dataset.id=n;
 g.innerHTML=`<circle class="ring" cx="${x}" cy="${y}" r="15"/><circle class="dot" cx="${x}" cy="${y}" r="15"/><text x="${x}" y="${y+1}">${n}</text>`;G.appendChild(g)});
const L=document.getElementById("legend");
Object.keys(S).forEach(n=>{const li=document.createElement("li");li.dataset.id=n;li.innerHTML=`<b>${n}</b>${S[n].s}`;L.appendChild(li)});
const all=()=>document.querySelectorAll("[data-id]");
function lit(id,on){all().forEach(e=>{if(e.dataset.id==id)e.classList.toggle("lit",on)})}
const M=document.getElementById("modal");let cur=1;
function open(id){cur=+id;const s=S[id];
 document.getElementById("mn").textContent=id;document.getElementById("mt").textContent=s.t;document.getElementById("mb").textContent=s.b;
 document.getElementById("mx").innerHTML=(s.tag?`<span class="tag">${s.tag}</span>`:"")+(s.ph?`<div class="ph">${s.ph}</div>`:"")+(s.img?`<div class="pics">${[].concat(s.img).map(u=>`<div class="pic"><img src="${u}" alt=""></div>`).join("")}</div>`:"");
 M.classList.add("open")}
const close=()=>M.classList.remove("open");
all().forEach(e=>{e.addEventListener("click",()=>open(e.dataset.id));
 e.addEventListener("mouseenter",()=>lit(e.dataset.id,true));e.addEventListener("mouseleave",()=>lit(e.dataset.id,false))});
const step=d=>open(((cur-1+d+10)%10)+1);
document.getElementById("prev").onclick=()=>step(-1);document.getElementById("next").onclick=()=>step(1);
document.getElementById("close").onclick=close;M.onclick=e=>{if(e.target===M)close()};
if(S[location.hash.slice(1)])open(location.hash.slice(1));
document.addEventListener("keydown",e=>{if(!M.classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)});
</script>
</body>
